[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa2011-dataplatform_jd353"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别数据平台工程师·重排模型的候选截断上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kappa2011" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kappa2011.github.io"
Repository = "https://github.com/kappa2011/dataplatform_jd353"
Issues = "https://github.com/kappa2011/dataplatform_jd353/issues"

[project.scripts]
dataplatform_jd353 = "dataplatform_jd353:main"

[tool.setuptools]
py-modules = ["dataplatform_jd353"]
